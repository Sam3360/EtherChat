<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EtherChat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #0b0d10;
            color: #f4f5f7;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(760px, 92%);
            padding: 55px 40px;

            text-align: center;

            background: #111419;
            border: 1px solid #252a31;
            border-radius: 24px;

            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0;
            font-size: 52px;
        }

        .subtitle {
            margin-top: 14px;

            color: #aeb6c1;

            font-size: 18px;
            line-height: 1.6;
        }

        .downloads {
            margin-top: 35px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .download {
            padding: 17px 12px;

            border-radius: 13px;

            background: #ffffff;
            color: #111111;

            text-decoration: none;

            font-weight: bold;
            font-size: 15px;

            transition: transform 0.15s, opacity 0.15s;
        }

        .download:hover {
            transform: translateY(-2px);
            opacity: 0.88;
        }

        .recommended {
            margin-top: 22px;

            color: #777f89;

            font-size: 13px;
        }

        .status {
            margin-top: 28px;

            color: #8f98a3;

            font-size: 14px;
        }

        @media (max-width: 650px) {
            .downloads {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>EtherChat</h1>

    <div class="subtitle">
        Private messaging for devices on the same local network.<br>
        No accounts. No cloud. No internet required.
    </div>

    <div class="downloads">

        <a
            id="windows"
            class="download"
            href="https://github.com/Sam3360/EtherChat/releases/latest/download/EtherChat-Windows.exe">
            Windows
        </a>

        <a
            id="macos"
            class="download"
            href="https://github.com/Sam3360/EtherChat/releases/latest/download/EtherChat-macOS.tar.gz">
            macOS
        </a>

        <a
            id="linux"
            class="download"
            href="https://github.com/Sam3360/EtherChat/releases/latest/download/EtherChat-Linux.tar.gz">
            Linux
        </a>

    </div>

    <div id="recommended" class="recommended">
        Choose your operating system above.
    </div>

    <div class="status">
        EtherChat v2.0.0
    </div>

</div>

<script>

    const userAgent = navigator.userAgent.toLowerCase();

    const windows = document.getElementById("windows");
    const macos = document.getElementById("macos");
    const linux = document.getElementById("linux");
    const recommended = document.getElementById("recommended");

    if (userAgent.includes("windows")) {

        windows.textContent = "Windows • Recommended";
        recommended.textContent = "Windows detected";

    } else if (userAgent.includes("mac")) {

        macos.textContent = "macOS • Recommended";
        recommended.textContent = "macOS detected";

    } else if (userAgent.includes("linux")) {

        linux.textContent = "Linux • Recommended";
        recommended.textContent = "Linux detected";

    }

</script>

</body>
</html>

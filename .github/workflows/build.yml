name: Build EtherChat

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name EtherChat-Windows etherchat.py

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name EtherChat etherchat.py
          tar -czf EtherChat-macOS.tar.gz -C dist EtherChat.app

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --name EtherChat-Linux etherchat.py
          tar -czf EtherChat-Linux.tar.gz -C dist EtherChat-Linux

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EtherChat-Windows
          path: dist/EtherChat-Windows.exe

      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: EtherChat-macOS
          path: EtherChat-macOS.tar.gz

      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: EtherChat-Linux
          path: EtherChat-Linux.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload files
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
